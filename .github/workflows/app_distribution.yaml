name: app_distribution

on:
  push:
    branches: [ main, develop, epic/** ]
  workflow_dispatch:
  
permissions:
  contents: write  
  
jobs:
  build:
    name: app_publish
    runs-on: ubuntu-latest
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          fetch-tags: true 
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES }}" | base64 --decode > app/google-services.json

      - name: Restore keys.properties
        run: |
          echo "${{ secrets.API_KEYS_FILE }}" > local.properties
          
      - name: Determine new version tag (safe for parallel runs)
        id: tagger
        run: |
          set -e
          branch="${GITHUB_REF#refs/heads/}"
      
          git fetch --tags
      
          while true; do
            latest=$(git tag --sort=-v:refname | head -n 1 || echo "v1.15.0")
            IFS='.' read -r major minor patch <<< "${latest#v}"
          
            if [[ "$branch" == "main" || "$branch" == "develop" ]]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
          
            new_tag="v$major.$minor.$patch"
          
            if git rev-parse "$new_tag" >/dev/null 2>&1; then
              patch=$((patch + 1))
              new_tag="v$major.$minor.$patch"
            fi
          
            git tag "$new_tag"
            if git push origin "$new_tag"; then
              echo "NEW_TAG=$new_tag" >> $GITHUB_ENV
              echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
              break
            else
              git fetch --tags
              git tag -d "$new_tag" 2>/dev/null || true
            fi
          done

      - name: Restore firebase_release_key
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > firebase_release_key.jks    

      - name: Build release with version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PversionName=${{ env.NEW_TAG }}
       

      - name: Rename output with version
        run: |
          mv app/build/outputs/apk/release/app-release.apk app-${{ env.NEW_TAG }}.apk

      - name: Set Firebase tester group
        id: tester_group
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]; then
            echo "group=${{ secrets.TESTERS_BETA }}" >> "$GITHUB_OUTPUT"
          else
            echo "group=${{ secrets.TESTERS_BETA }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Release Note
        id: release_notes
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]; then
            echo "notes=${{ secrets.MAIN_RELEASE_NOTES }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="${GITHUB_REF_NAME##*/}"
            echo "notes=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi          


      - name: Upload APK using Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
          app-${{ env.NEW_TAG }}.apk \
          --app ${{ secrets.FIREBASE_APP_ID }} \
          --token ${{ secrets.FIREBASE_TOKEN }} \
          --groups "${{ steps.tester_group.outputs.group }}" \
          --release-notes  "${{ steps.release_notes.outputs.notes }}"
