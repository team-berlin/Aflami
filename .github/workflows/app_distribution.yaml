name: app_distribution

on:
  push:
    branches: [ main, develop, epic/** ]
  workflow_dispatch:
  
permissions:
  contents: write  
  
jobs:
  build:
    name: app_publish
    runs-on: ubuntu-latest
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES }}" | base64 --decode > app/google-services.json

      - name: Restore keys.properties
        run: |
          echo "${{ secrets.API_KEYS_FILE }}" > local.properties
      - name: Fetch all tags
        run: git fetch --tags

      - name: Determine new version tag
        id: tagger
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $branch"

          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $latest"

          IFS='.' read -r major minor patch <<< "${latest#v}"

          if [[ "$branch" == "main" || "$branch" == "release" ]]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_tag="v$major.$minor.$patch"
          echo "New tag: $new_tag"

          echo "NEW_TAG=$new_tag" >> $GITHUB_ENV
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Build release with version
        run: |
          ./gradlew assembleDebug -PversionName=${{ env.NEW_TAG }}

      - name: Rename output with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app-${{ env.NEW_TAG }}.apk


      - name: Create and push Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}
          

      - name: Set Firebase tester group
        id: tester_group
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]; then
            echo "group=${{ secrets.TESTERS_RELEASE }}" >> "$GITHUB_OUTPUT"
          else
            echo "group=${{ secrets.TESTERS_BETA }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Release Note
        id: release_notes
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]; then
            echo "notes=${{ secrets.MAIN_RELEASE_NOTES }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="${GITHUB_REF_NAME##*/}"
            echo "notes=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi          


      - name: Upload APK using Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
          app-${{ env.NEW_TAG }}.apk \
          --app ${{ secrets.FIREBASE_APP_ID }} \
          --token ${{ secrets.FIREBASE_TOKEN }} \
          --groups "${{ steps.tester_group.outputs.group }}" \
          --release-notes  "${{ steps.release_notes.outputs.notes }}"
